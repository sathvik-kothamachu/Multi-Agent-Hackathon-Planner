# Multi-Agent Hackathon Planner — full stack.
#
# Quick start (zero-key demo, deterministic mock LLM):
#   docker compose up --build
#   open http://localhost:8080
#
# Real LLM: create a .env next to this file with LLM_PROVIDER=google and
# LLM_API_KEY=your_key (see backend/.env.example). Compose reads it automatically.
services:
  backend:
    build: ./backend
    environment:
      # Defaults to the offline mock so the stack runs with no API key.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MODEL_NAME: ${MODEL_NAME:-gemini-1.5-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALIGNMENT_THRESHOLD: ${ALIGNMENT_THRESHOLD:-0.75}
      MAX_DEBATE_ROUNDS: ${MAX_DEBATE_ROUNDS:-3}
      MAX_IDEAS: ${MAX_IDEAS:-3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - planner-data:/data
    ports:
      - "8000:8000"   # direct API access + /docs (frontend proxies internally)
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  planner-data:
