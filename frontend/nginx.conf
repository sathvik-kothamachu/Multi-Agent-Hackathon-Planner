# Serves the SPA and reverse-proxies API/health calls to the backend service.
# Because the browser only ever talks to this origin, the proxied /api calls are
# same-origin and never trigger CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Debate can take a while under a real LLM — allow long upstream reads.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback — every unknown route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
